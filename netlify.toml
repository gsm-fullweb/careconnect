[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/sobre"
  to = "/about"
  status = 301
  force = true

[[redirects]]
  from = "/servicos"
  to = "/services"
  status = 301
  force = true

[[redirects]]
  from = "/planos"
  to = "/plans"
  status = 301
  force = true

[[redirects]]
  from = "/Admin"
  to = "/admin"
  status = 301
  force = true

[[redirects]]
  from = "/Admin/*"
  to = "/admin/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/contato"
  to = "/contact"
  status = 301
  force = true

[[redirects]]
  from = "/cuidadores-mogi"
  to = "/cuidador-idosos-mogi-das-cruzes"
  status = 301
  force = true

# SPA fallback — must be LAST
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
